services:
  valheim:
    build:
      context: .
      dockerfile: Dockerfile
    image: valheim-pi4-box32:local
    platform: linux/arm64
    container_name: valheim
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 180s
    environment:
      NAME: "${NAME:-Valheim Dedicated Server}"
      PORT: "${PORT:-2456}"
      WORLD: "${WORLD:-DedicatedWorld}"
      # PASSWORD_FILE, when set, takes precedence over PASSWORD in the image.
      # Keeping PASSWORD optional here permits a Docker-secret override.
      PASSWORD: "${PASSWORD:-}"
      PASSWORD_FILE: "${PASSWORD_FILE:-}"
      # Do not interpolate the generic host variable PUBLIC: it is defined by
      # Windows as C:\\Users\\Public and would override a .env value.
      PUBLIC: "${SERVER_PUBLIC:-0}"
      CROSSPLAY: "${CROSSPLAY:-true}"
      # Optional world difficulty/modifier flags, passed after the standard
      # server arguments. Example: -preset hard -modifier raids none
      SERVER_ARGS: "${SERVER_ARGS:-}"
      # Platform IDs, separated by spaces or commas. Empty values leave the
      # existing permission files unchanged.
      ADMINLIST_IDS: "${ADMINLIST_IDS:-}"
      BANNEDLIST_IDS: "${BANNEDLIST_IDS:-}"
      PERMITTEDLIST_IDS: "${PERMITTEDLIST_IDS:-}"
      SAVEDIR: "/config"
      # Refuse to start if the persistent save directory is not a bind mount.
      ALLOW_NO_VOLUME: "false"
      # Set both to the Pi account's numeric IDs to avoid root-owned saves.
      # Zero keeps the upstream image's root-compatible default.
      PUID: "${PUID:-0}"
      PGID: "${PGID:-0}"
      TZ: "${TZ:-UTC}"
      SAVEINTERVAL: "${SAVEINTERVAL:-900}"
      BACKUPS: "${BACKUPS:-4}"
      BACKUPSHORT: "${BACKUPSHORT:-7200}"
      BACKUPLONG: "${BACKUPLONG:-43200}"
      # The image owns the only periodic archive job. BACKUPS_CRON, when set,
      # overrides BACKUPS_INTERVAL.
      BACKUPS_INTERVAL: "${BACKUPS_INTERVAL:-3600}"
      BACKUPS_CRON: "${BACKUPS_CRON:-}"
      BACKUPS_DIRECTORY: "/config/backups"
      BACKUPS_MAX_AGE: "${BACKUPS_MAX_AGE:-14}"
      BACKUPS_MAX_COUNT: "${BACKUPS_MAX_COUNT:-168}"
      BACKUPS_ZIP: "${BACKUPS_ZIP:-true}"
      UPDATE_INTERVAL: "${UPDATE_INTERVAL:-0}"
      UPDATE_IF_IDLE: "${UPDATE_IF_IDLE:-true}"
      UPDATE_IDLE_CHECKS: "${UPDATE_IDLE_CHECKS:-5}"
      UPDATE_IDLE_CHECK_INTERVAL: "${UPDATE_IDLE_CHECK_INTERVAL:-60}"
      IDLE_DATAGRAM_WINDOW: "${IDLE_DATAGRAM_WINDOW:-3}"
      IDLE_DATAGRAM_MAX_COUNT: "${IDLE_DATAGRAM_MAX_COUNT:-30}"
      SERVER_STOP_TIMEOUT: "${SERVER_STOP_TIMEOUT:-150}"
      RESTART_CRON: "${RESTART_CRON:-}"
      RESTART_IF_IDLE: "${RESTART_IF_IDLE:-true}"
      ARM64_DEVICE: "rpi4"
      DEBUGGER: "/usr/local/bin/box64"
      STEAM_PLATFORM: "linux32"
      BOX64_AES: "0"
      BOX64_PCLMULQDQ: "0"
      BOX64_SHAEXT: "0"
      BOX64_AVX: "0"
      # More conservative dynarec settings improve stability on Pi 4.
      BOX64_DYNAREC_BIGBLOCK: "0"
      BOX64_DYNAREC_STRONGMEM: "3"
      BOX64_DYNAREC_SAFEFLAGS: "2"
      BOX64_DYNAREC_FASTROUND: "0"
      BOX64_DYNAREC_FASTNAN: "0"
      BOX64_DYNAREC_X87DOUBLE: "1"
    volumes:
      - ./config:/config
      - ./data:/opt/valheim
      # Keep generated rolling archives outside config/worlds_local.
      - ./backups/valheim:/config/backups
      - ./steam-diagnostics:/root/Steam/logs
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
